<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rang Club - Double Sir</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #0b3d24; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #062415; padding: 12px; text-align: center; font-size: 20px; font-weight: bold; color: #f1c40f; border-bottom: 2px solid #f1c40f; }
        #lobby { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; padding: 20px; }
        input { padding: 12px; border-radius: 8px; border: none; width: 260px; font-size: 16px; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #f1c40f; color: #062415; font-weight: bold; font-size: 16px; cursor: pointer; width: 260px; }
        button.bot-btn { background: #2ecc71; color: white; }
        #gameArea { display: none; flex: 1; flex-direction: column; justify-content: space-between; padding: 10px; position: relative; }
        .top-bar { display: flex; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .trump-badge { background: #e74c3c; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .table-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
        .played-cards { display: flex; gap: 10px; min-height: 90px; }
        .card { width: 55px; height: 80px; background: white; color: black; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); cursor: pointer; user-select: none; }
        .card.red { color: #d63031; }
        .hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 10px 0; }
        #trumpModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; gap: 15px; z-index: 100; }
        .suit-btns { display: flex; gap: 15px; }
        .suit-btn { font-size: 30px; padding: 15px 20px; background: white; border-radius: 10px; width: auto; }
        .comms-bar { display: flex; gap: 8px; background: #062415; padding: 8px; align-items: center; }
        .comms-bar button { width: auto; }
        #chatBox { position: fixed; bottom: 55px; right: 10px; width: 250px; height: 180px; background: rgba(0,0,0,0.85); border-radius: 8px; display: none; flex-direction: column; padding: 8px; z-index: 50; }
        #messages { flex: 1; overflow-y: auto; font-size: 13px; margin-bottom: 5px; }
        .mic-active { background: #2ecc71 !important; color: white !important; }
    </style>
</head>
<body>

<header>♠️ Rang Club (Double Sir) ♥️</header>

<div id="lobby">
    <p id="connStatus" style="font-size: 13px; color: #2ecc71;">Connecting to server...</p>
    <input type="text" id="playerName" placeholder="Apna Naam Likhein" />
    <input type="text" id="roomCode" placeholder="Room Code (e.g. 1234)" />
    <button onclick="joinGame()">Room Join Karein (4 Players)</button>
    <button class="bot-btn" onclick="startSoloTest()">🤖 Test Game (Akelay Khelein)</button>
    <p id="lobbyStatus" style="color: #f1c40f; text-align:center; font-weight:bold;"></p>
</div>

<div id="trumpModal">
    <h2>Rang (Trump) Select Karein:</h2>
    <div class="suit-btns">
        <button class="suit-btn" onclick="chooseTrump('♠')">♠</button>
        <button class="suit-btn" style="color:red" onclick="chooseTrump('♥')">♥</button>
        <button class="suit-btn" style="color:red" onclick="chooseTrump('♦')">♦</button>
        <button class="suit-btn" onclick="chooseTrump('♣')">♣</button>
    </div>
</div>

<div id="gameArea">
    <div class="top-bar">
        <div>Team A: <span id="scoreA">0</span> | Team B: <span id="scoreB">0</span></div>
        <div>Pending: <span id="pendingSirs">0</span></div>
        <div>Rang: <span id="trumpDisplay" class="trump-badge">?</span></div>
    </div>
    <div class="table-center">
        <p id="statusText" style="color: #f1c40f; font-weight: bold; text-align: center;">Waiting...</p>
        <div class="played-cards" id="tableCards"></div>
    </div>
    <div class="hand" id="playerHand"></div>
</div>

<div id="chatBox">
    <div id="messages"></div>
    <div style="display:flex; gap:4px;">
        <input type="text" id="chatInput" placeholder="Message..." style="width:100%; padding:6px; font-size:13px;" />
        <button onclick="sendChat()" style="padding:6px 10px; font-size:13px; width:auto;">Send</button>
    </div>
</div>

<div class="comms-bar" id="commsBar" style="display:none;">
    <button id="micBtn" onclick="toggleMic()" style="padding:8px 12px; font-size:14px;">🎤 Mic Off</button>
    <button onclick="toggleChat()" style="padding:8px 12px; font-size:14px;">💬 Chat</button>
</div>

<script>
    const socket = io({ transports: ['websocket', 'polling'] });
    let myIndex = -1;
    let localStream;
    let peers = {};

    socket.on('connect', () => {
        document.getElementById('connStatus').innerText = '✅ Server Connected!';
        document.getElementById('connStatus').style.color = '#2ecc71';
    });

    socket.on('connect_error', (err) => {
        document.getElementById('connStatus').innerText = '❌ Server Connection Error: ' + err.message;
        document.getElementById('connStatus').style.color = '#e74c3c';
    });

    function joinGame() {
        const name = document.getElementById('playerName').value.trim();
        const code = document.getElementById('roomCode').value.trim().toUpperCase();
        if (!name || !code) return alert('Naam aur Room Code dono likhein!');
        document.getElementById('lobbyStatus').innerText = 'Joining room...';
        socket.emit('joinRoom', { roomCode: code, playerName: name });
    }

    function startSoloTest() {
        const name = document.getElementById('playerName').value.trim() || 'Faizan';
        const testCode = 'TEST' + Math.floor(Math.random() * 1000);
        socket.emit('joinRoom', { roomCode: testCode, playerName: name });
        setTimeout(() => {
            const botSocket2 = io({ transports: ['websocket', 'polling'] });
            const botSocket3 = io({ transports: ['websocket', 'polling'] });
            const botSocket4 = io({ transports: ['websocket', 'polling'] });
            botSocket2.emit('joinRoom', { roomCode: testCode, playerName: 'Bot 2' });
            botSocket3.emit('joinRoom', { roomCode: testCode, playerName: 'Bot 3' });
            botSocket4.emit('joinRoom', { roomCode: testCode, playerName: 'Bot 4' });
        }, 500);
    }

    socket.on('updatePlayers', (players) => {
        document.getElementById('lobbyStatus').innerText = `Players Joined: ${players.length}/4 (${players.map(p => p.name).join(', ')})\nBaqi ${4 - players.length} players ka intezar hai...`;
        const me = players.find(p => p.id === socket.id);
        if (me) myIndex = me.index;

        if (players.length === 4) {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
            document.getElementById('commsBar').style.display = 'flex';
            setupVoice(players);
        }
    });

    socket.on('dealCards', ({ hand, phase, isTrumpSelector, trump }) => {
        renderHand(hand);
        if (phase === 'selectTrump' && isTrumpSelector) {
            document.getElementById('trumpModal').style.display = 'flex';
        }
        if (trump) document.getElementById('trumpDisplay').innerText = trump;
    });

    function chooseTrump(suit) {
        document.getElementById('trumpModal').style.display = 'none';
        socket.emit('selectTrump', suit);
    }

    socket.on('trumpSelected', (suit) => {
        document.getElementById('trumpDisplay').innerText = suit;
    });

    socket.on('turnUpdate', (turnIndex) => {
        document.getElementById('statusText').innerText = turnIndex === myIndex ? "Aap ki Baari Hai!" : `Player ${turnIndex + 1} ki baari hai...`;
    });

    socket.on('updateHand', renderHand);

    function renderHand(hand) {
        const handDiv = document.getElementById('playerHand');
        handDiv.innerHTML = '';
        hand.forEach((card, idx) => {
            const isRed = card.suit === '♥' || card.suit === '♦';
            const div = document.createElement('div');
            div.className = `card ${isRed ? 'red' : ''}`;
            div.innerHTML = `<span>${card.value}</span><span>${card.suit}</span>`;
            div.onclick = () => socket.emit('playCard', idx);
            handDiv.appendChild(div);
        });
    }

    socket.on('cardPlayed', (cards) => {
        const table = document.getElementById('tableCards');
        table.innerHTML = '';
        cards.forEach(item => {
            const isRed = item.card.suit === '♥' || item.card.suit === '♦';
            table.innerHTML += `<div style="text-align:center;">
                <div class="card ${isRed ? 'red' : ''}"><span>${item.card.value}</span><span>${item.card.suit}</span></div>
                <small>${item.playerName}</small>
            </div>`;
        });
    });

    socket.on('trickEnded', ({ scores, pendingSirs }) => {
        document.getElementById('tableCards').innerHTML = '';
        document.getElementById('scoreA').innerText = scores.teamA;
        document.getElementById('scoreB').innerText = scores.teamB;
        document.getElementById('pendingSirs').innerText = pendingSirs;
    });

    socket.on('gameStatus', (msg) => document.getElementById('statusText').innerText = msg);
    socket.on('errorMsg', (msg) => alert(msg));
